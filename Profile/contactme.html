<!DOCTYPE html>
<html lang="es">
<head>
  <title>Contacto</title>
  <link rel="stylesheet" href="contactme.css">
</head>
<body>
  <div class="cajaFondo">
    <h1>Contacta conmigo! </h1>
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Hola" required>

      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" placeholder="Email(ej: nestor@gmail.com)" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje" required></textarea>
      <button type="submit">Enviar</button>
  </div>  
</body>
</html>
